name: CI - Build, Testes e Validação IaC

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build e testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Auditoria de segurança das dependências
        run: npm audit --audit-level=high

      - name: Executar build/validação sintática
        run: npm run build

      - name: Executar testes automatizados
        run: npm test

  docker-image:
    name: Construir e testar a imagem Docker
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Construir a imagem
        run: docker build -t devops-api-fase1:ci .

      - name: Subir o container e executar smoke test
        run: |
          docker run -d --name api -p 3000:3000 devops-api-fase1:ci
          bash scripts/smoke-test.sh http://localhost:3000

      - name: Exibir logs estruturados do container
        if: always()
        run: docker logs api || true

      - name: Encerrar o container
        if: always()
        run: docker rm -f api || true

  terraform-validate:
    name: Validar Infraestrutura como Código
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5

      - name: Verificar formatação
        working-directory: terraform
        run: terraform fmt -check

      - name: Inicializar Terraform sem backend remoto
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validar scripts Terraform
        working-directory: terraform
        run: terraform validate
